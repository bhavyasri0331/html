<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Your Orders</h2>

    <!-- Order 1 -->
    <div class="card mb-3">
      <div class="row g-0">
        <div class="col-md-2">
          <img src="scooter.jpg" class="img-fluid rounded-start" alt="Scooter">
        </div>
        <div class="col-md-10">
          <div class="card-body">
            <h5 class="card-title">Electric Scooter</h5>
            <p class="card-text">Delivery Date: July 3, 2025</p>
            <p class="card-text"><small class="text-muted">Order ID: #ORD123456</small></p>
            <a href="#" class="btn btn-primary btn-sm">Track Package</a>
            <a href="#" class="btn btn-outline-danger btn-sm">Cancel</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Order 2 -->
    <div class="card mb-3">
      <div class="row g-0">
        <div class="col-md-2">
          <img src="skin.jpeg" class="img-fluid rounded-start" alt="Skin Care">
        </div>
        <div class="col-md-10">
          <div class="card-body">
            <h5 class="card-title">Skin Care Set</h5>
            <p class="card-text">Delivery Date: June 28, 2025</p>
            <p class="card-text"><small class="text-muted">Order ID: #ORD789012</small></p>
            <a href="#" class="btn btn-primary btn-sm">Track Package</a>
            <a href="#" class="btn btn-outline-danger btn-sm">Cancel</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Order 3 -->
    <div class="card mb-3">
      <div class="row g-0">
        <div class="col-md-2">
          <img src="cloth1.jpeg" class="img-fluid rounded-start" alt="Fashion">
        </div>
        <div class="col-md-10">
          <div class="card-body">
            <h5 class="card-title">Women's Summer Dress</h5>
            <p class="card-text">Delivered on: June 20, 2025</p>
            <p class="card-text"><small class="text-muted">Order ID: #ORD345678</small></p>
            <a href="#" class="btn btn-secondary btn-sm disabled">Delivered</a>
            <a href="#" class="btn btn-outline-primary btn-sm">Buy Again</a>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
