<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button Styling</title>

  <style>
    .blue-button {
      background-color: blue;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }
  </style>

  <link rel="stylesheet" href="style2.css">
</head>
<body>

  <button class="green-button">Green Button (External CSS)</button>

  
  <button class="blue-button">Blue Button (Style Tag)</button>

  <button style="background-color: pink; color: white; padding: 10px 20px; border: none; cursor: pointer;">
    Pink Button (Inline Style)
  </button>

</body>
</html>
