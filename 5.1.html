<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Bootstrap Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar {
      background-color: #131921;
    }
    .navbar-brand img {
      height: 40px;
    }
    .form-control {
      width: 400px;
    }
    .nav-link {
      color: white !important;
      font-size: 14px;
    }
    .search-button {
      background-color: #febd69;
      color: black;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-3">
  <a class="navbar-brand" href="#">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Logo">
  </a>

  <form class="d-flex mx-3 w-50" role="search">
    <input class="form-control me-2" type="search" placeholder="Search Amazon" aria-label="Search">
    <button class="btn search-button" type="submit">Search</button>
  </form>

  <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
    <li class="nav-item text-white me-3">
      <a class="nav-link" href="#"><small>Hello, Sign in</small><br><strong>Account & Lists</strong></a>
    </li>
    <li class="nav-item text-white me-3">
      <a class="nav-link" href="#"><small>Returns</small><br><strong>& Orders</strong></a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#">
        <img src="https://img.icons8.com/material-outlined/24/ffffff/shopping-cart.png"/>
        Cart
      </a>
    </li>
  </ul>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
