<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        background-color: black;
        padding: 10px;
        font-size: 12px;
        display: flex;
    }
    .box1{
        background-color: rgb(255,240,245);
        padding: 10px;
        margin: 5px;
    }
    .box2{
        background-color: rgb(215,224,250);
        padding: 10px;
        margin: 5px;
    }
    .box3{
        background-color: blueviolet;
        padding: 10px;
        margin: 5px;
    }
    .box4{
        background-color: rgb(43, 226, 195);
        padding: 10px;
        margin: 5px;
    }
    
    @media(min-width:300px){
        .box1{
            background-color: rgb(145, 255, 0);
            font-size: 23px;
        }
    }
    @media(max-width:300px)and (max-width:400px){
        .box2{
            background-color:palevioletred;
            font-size: large;
        }
    }
    @media(max-width:400px)and (max-width:600px){
        .box3{
            background-color: rgb(255, 0, 0);
            font-size: 48px;
        }
    }
     @media(max-width:600px){
        .box4{
            background-color: rgb(0, 81, 255);
            font-size: 48px;
        }
    }
    
</style>
<body>
    <div class="container">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
        <div class="box4">box3</div>
    </div>
</body>
</html>
