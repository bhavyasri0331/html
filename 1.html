<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
</head>
<body>
    <form action="">
        <h1>Employee Details</h1>
        <label for="n">Employee name:</label>
        <input type="text" placeholder="Enter your name" ><br><br>
        <label for="no">Id:</label>
        <input type="number" placeholder="Enter your id" id="no"><br><br>
        <label for="r">Company:</label>
        <input type="text" placeholder="Enter your company Name" id="r"><br><br>
        <label for="y">Village:</label>
        <input type="text" placeholder="Enter your Village name" id="y"><br><br>
        <label for="s">Salary:</label>
        <input type="number" placeholder="Enter your Salary" id="s"><br><br>
        <label for="e">Email:</label>
        <input type="email" placeholder="Enter your Email" id="e"><br><br>
        <label for="file">Upload file</label>
        <input type="file" id="file"><br><br>
        <label for="b">Button</label>
        <input type="submit" id="b">

    </form>
    
</body>
</html>
