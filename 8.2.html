<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bouncing Circle</title>
  <style>
    .circle {
      width: 100px;
      height: 100px;
      background-color: #3498db;
      border-radius: 50%;
      position: relative;
      animation: bounce 1s ease-in-out infinite;
    }

    @keyframes bounce {
      0%   { top: 0; }
      50%  { top: 1000px; }
      100% { top: 0; }
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="circle"></div>
</body>
</html>
