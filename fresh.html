<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fresh Grocery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .card-img-top {
      height: 200px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">🥦 Amazon Fresh</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-4">
    <h2 class="mb-4 text-center">Fresh Grocery Essentials</h2>

    <div class="row">
      <!-- Card 1 - Fruits -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="fruits.jpeg" class="card-img-top" alt="Fresh Fruits">
          <div class="card-body">
            <h5 class="card-title">Fresh Fruits</h5>
            <p class="card-text">Wide range of fresh seasonal fruits delivered to your doorstep.</p>
            <a href="#" class="btn btn-success">Shop Now</a>
          </div>
        </div>
      </div>

      <!-- Card 2 - Vegetables -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="vegetables.jpeg" class="card-img-top" alt="Vegetables">
          <div class="card-body">
            <h5 class="card-title">Vegetables</h5>
            <p class="card-text">Fresh and green vegetables for your daily cooking needs.</p>
            <a href="#" class="btn btn-success">Shop Now</a>
          </div>
        </div>
      </div>

      <!-- Card 3 - Dairy -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="dairy.jpeg" class="card-img-top" alt="Dairy Products">
          <div class="card-body">
            <h5 class="card-title">Dairy Products</h5>
            <p class="card-text">Milk, cheese, butter and more – always fresh, always ready.</p>
            <a href="#" class="btn btn-success">Shop Now</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
